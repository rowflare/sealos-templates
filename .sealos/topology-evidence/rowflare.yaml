apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: rowflare-topology
spec:
  appName: rowflare
  source: https://github.com/rowflare/rowflare/blob/d7a46839f664333961595d7d62d4c0361920d681/docker-compose.yml
  resources:
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
